[versions]
agp = "8.9.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.02.00"
coroutines = "1.10.1"
coil-compose = "2.7.0"
ksp = "2.0.21-1.0.27"
hiltJavax = "1"
mockK = "1.13.11"
appcompat = "1.7.1"
material = "1.12.0"
hilt = "2.50"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
androidXArchCoreTest = "2.2.0"
robolectric = "4.10.3"
googleGMS = "4.4.3"
