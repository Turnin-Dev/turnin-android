name: Android CD

on:
    push:
        branches: [ main ]

permissions:
    contents: read
    actions: write

jobs:
    deploy:
        name: Build & Deploy (Release)
        runs-on: ubuntu-latest
        steps:
            # 1. 코드 체크아웃
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # 2. JDK 설정
            -   name: Set up JDK 17
                uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
                with:
                    java-version: '17'
                    distribution: 'temurin'

            # 3. 필수 파일 동적 생성 (local.properties, google-services.json 등)
            -   name: Generate local.properties
                run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

            -   name: Decode & Generate google-services.json
                run: |
                    # debug 폴더 생성 및 파일 생성
                    mkdir -p app/src/debug
                    echo "${{ secrets.GOOGLE_SERVICES_DEBUG_JSON_BASE64 }}" | base64 --decode > app/src/debug/google-services.json

                    # release 폴더 생성 및 파일 생성
                    mkdir -p app/src/release
                    echo "${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}" | base64 --decode > app/src/release/google-services.json

                    # 3. releaseTest 폴더 생성 및 파일 복사 (디버그용 파일로 복사)
                    mkdir -p app/src/releaseTest
                    cp app/src/debug/google-services.json app/src/releaseTest/google-services.json

            # 4. Gradle 설정
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
                with:
                    cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
                    cache-read-only: false

            # 5. 서명 설정
            -   name: Decode Keystore
                run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

            # 6. Release APK & AAB 빌드
            -   name: Build Release APK & AAB
                env:
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    ./gradlew assembleRelease bundleRelease \
                      -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/keystore.jks" \
                      -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                      -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                      -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

            # 7. Firebase App Distribution 배포
            -   name: Deploy to Firebase App Distribution
                uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
                with:
                    appId: ${{ secrets.FIREBASE_APP_ID }}
                    serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                    groups: testers
                    file: app/build/outputs/apk/release/app-release.apk
                    releaseNotes: |
                        Branch: ${{ github.ref_name }}
                        Commit: ${{ github.sha }}
                        Author: ${{ github.actor }}
                        ${{ github.event.head_commit.message }}

            # 8. Play Store 배포 (비공개 테스트 트랙)
            -   name: Deploy to Play Store (Closed Testing)
                uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
                with:
                    serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
                    packageName: com.turnin.app
                    releaseFiles: app/build/outputs/bundle/release/app-release.aab
                    track: alpha
                    status: completed

            # 9. Keystore 삭제 (보안)
            -   name: Clean up Keystore
                if: always()
                run: rm -f app/keystore.jks
