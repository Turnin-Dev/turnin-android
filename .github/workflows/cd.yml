name: Android CD

on:
    push:
        branches: [ main ]

jobs:
    deploy:
        name: Build & Deploy (Release)
        runs-on: ubuntu-latest
        steps:
            # 1. 코드 체크아웃
            -   name: Checkout
                uses: actions/checkout@v4

            # 2. JDK 설정
            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            # 3. Gradle 설정
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v3

            # 4. 서명 설정
            -   name: Decode Keystore
                run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

            # 5. Release APK 빌드
            -   name: Build Release APK
                env:
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    ./gradlew assembleRelease \
                      -Pandroid.injected.signing.store.file=app/keystore.jks \
                      -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                      -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                      -Pandroid.injected.signing.key.password=$KEY_PASSWORD

            # 6. Release AAB 빌드 (Play Store 배포 시 주석 해제)
            #            -   name: Build Release AAB
            #                env:
            #                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            #                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            #                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
            #                run: |
            #                    ./gradlew bundleRelease \
            #                      -Pandroid.injected.signing.store.file=app/keystore.jks \
            #                      -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            #                      -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            #                      -Pandroid.injected.signing.key.password=$KEY_PASSWORD

            # 7. Firebase App Distribution 배포
            -   name: Deploy to Firebase App Distribution
                uses: wzieba/Firebase-Distribution-Github-Action@v1
                with:
                    appId: ${{ secrets.FIREBASE_APP_ID }}
                    serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                    groups: testers
                    file: app/build/outputs/apk/release/app-release.apk
                    releaseNotes: |
                        Branch: ${{ github.ref_name }}
                        Commit: ${{ github.sha }}
                        Author: ${{ github.actor }}
                        ${{ github.event.head_commit.message }}

            # 8. Play Store 배포 (내부 테스트 트랙, Play Store 배포 시 주석 해제)
            # - name: Deploy to Play Store (Internal Track)
            #   uses: r0adkll/upload-google-play@v1
            #   with:
            #     serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
            #     packageName: com.turnin.app
            #     releaseFiles: app/build/outputs/bundle/release/app-release.aab
            #     track: internal
            #     status: completed

            # 9. Keystore 삭제 (보안)
            -   name: Clean up Keystore
                if: always()
                run: rm -f app/keystore.jks
