name: Android CI

on:
    pull_request:
        branches: [ main ]
        types: [ opened, synchronize, reopened ]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: Lint & Test & Build
        runs-on: ubuntu-latest
        steps:
            # 1. 체크아웃
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # 2. JDK 설정
            -   name: Set up JDK 17
                uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
                with:
                    java-version: '17'
                    distribution: 'temurin'

            # 3. 필수 파일 동적 생성 (local.properties, google-services.json 등)
            -   name: Generate local.properties
                run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

            -   name: Decode & Generate google-services.json
                run: |
                    # debug 폴더 생성 및 파일 생성
                    mkdir -p app/src/debug
                    echo "${{ secrets.GOOGLE_SERVICES_DEBUG_JSON_BASE64 }}" | base64 --decode > app/src/debug/google-services.json

                    # release 폴더 생성 및 파일 생성
                    mkdir -p app/src/release
                    echo "${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}" | base64 --decode > app/src/release/google-services.json

                    # 3. releaseTest 폴더 생성 및 파일 복사 (디버그용 파일로 복사)
                    mkdir -p app/src/releaseTest
                    cp app/src/debug/google-services.json app/src/releaseTest/google-services.json

            # 4. Gradle 설정
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
                with:
                    cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

            # 5. ktlint 검사
            -   name: Run ktlint
                run: ./gradlew ktlintCheck

            # 6. Unit Test 실행
            -   name: Run Unit Tests
                run: ./gradlew testDebugUnitTest

            # 7. Debug APK 빌드
            -   name: Build Debug APK
                run: ./gradlew assembleDebug

            # 8. 실패 시 리포트 업로드
            -   name: Upload test reports
                if: failure()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: test-reports
                    path: |
                        app/build/reports/tests/
                        app/build/reports/ktlint/
                    retention-days: 7
                    if-no-files-found: warn
